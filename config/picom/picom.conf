# picom 12 — compositeur avec animations (remplace celui de xfwm4)
# Modèle de XfcePersonnaliser, copié par bureau-modeles s'il n'y a pas encore de picom.conf
backend = "glx";
vsync = true;
# Ne redessine que les zones qui changent (false : tout l'écran au moindre changement)
use-damage = true;

# Ombres
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -16;
shadow-offset-y = -12;

# Coins arrondis
corner-radius = 10;

# Fondu léger pour les menus et bulles
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

animations = (
  # Réduction : la fenêtre glisse vers le dock
  { triggers = ["hide"]; preset = "fly-out"; direction = "down"; duration = 0.28; },
  # Restauration depuis le dock
  { triggers = ["show"]; preset = "fly-in"; direction = "down"; duration = 0.28; },
  # Ouverture / fermeture
  { triggers = ["open"]; preset = "appear"; scale = 0.9; duration = 0.18; },
  { triggers = ["close"]; preset = "disappear"; scale = 0.9; duration = 0.15; },
  # Déplacement / redimensionnement (agrandir, ancrer)
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.2; }
);

rules = (
  # Fond animé : pendant la vidéo (propriété _FOND_ANIME), le fond uni de xfdesktop devient transparent
  { match = "class_g = 'Xfdesktop' && window_type = 'desktop' && _FOND_ANIME@"; shader = "fond-anime.glsl"; opacity = 0.99; },
  # Panneaux, bureau et fond animé : ni ombre, ni arrondi, ni animation
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'fond-anime-mpv'";
    shadow = false; corner-radius = 0; fade = false; animations = (); },
  # Menus, bulles, glisser-déposer : juste un fondu
  { match = "window_type = 'tooltip' || window_type = 'dnd' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'notification'";
    shadow = false; animations = (); },
  # Fenêtres GTK à décoration intégrée : elles dessinent déjà leur ombre
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },
  # Alt+Tab : arrondi géré par le CSS
  { match = "class_g = 'Xfwm4'"; corner-radius = 0; shadow = false; animations = (); }
);
