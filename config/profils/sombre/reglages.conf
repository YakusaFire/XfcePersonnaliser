# Profil d'exemple « sombre » : apparence seulement. Chaque ligne « canal propriété type valeur »
# est appliquée par xfconf-query ; le reste du bureau (panneaux, lanceurs, raccourcis…) n'est
# pas touché. « fond CHEMIN » : image du bureau. Un thème absent est sauté.
# Tout vient de Debian : Adwaita-dark (gnome-themes-extra), Papirus (papirus-icon-theme),
# Inter (fonts-inter), décoration Default d'xfwm4 (suit les couleurs du thème), fonds d'XFCE.
xsettings /Net/ThemeName string Adwaita-dark
xsettings /Net/IconThemeName string Papirus-Dark
xsettings /Gtk/CursorThemeName string Adwaita
xsettings /Gtk/FontName string Inter 10
xfwm4 /general/theme string Default
xfwm4 /general/title_font string Inter Bold 10
xfce4-panel /panels/dark-mode bool true
fond /usr/share/backgrounds/xfce/xfce-cp-dark.svg
